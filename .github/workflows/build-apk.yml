name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -q controle-ps2-android-projeto.zip -d ./src

      - name: Compilar APK
        run: gradle -p src/ps2-controller-android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: controle-ps2-apk
          path: src/ps2-controller-android/app/build/outputs/apk/debug/app-debug.apk
          
